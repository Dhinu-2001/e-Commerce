apiVersion : v1
kind : Service
metadata :
  name : comicmise
spec :
  selector :
    app : comicmise
  type : LoadBalancer
  ports :
    - port : 8000
      targetPort : 8000
---
apiVersion : apps/v1
kind : Deployment
metadata :
  name : comicmise
spec :
  replicas : 1
  selector :
    matchLabels :
      app : comicmise
  template :
    metadata :
      labels :
        app : comicmise
    spec :
      containers :
      - name : comicmise-container
        image : dhinucphilip/comicmise
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secrets
        ports :
          - containerPort : 8000
        imagePullPolicy : Always